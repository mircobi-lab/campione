# Compila MBStudio91 Campione su GitHub a ogni aggiornamento del ramo main:
#  - Mac: VST3 + AU + app, binario universale (Apple Silicon e Intel), firma ad hoc, controllo con pluginval
#  - Windows: VST3 + app (x64)
# I file pronti vengono pubblicati nella pagina "Releases" del repository: non serve scaricare i sorgenti.
name: build

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prova:
    name: Prova del motore (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Librerie di sistema per JUCE
        run: sudo apt-get update -q && sudo apt-get install -y -q libfreetype-dev libfontconfig1-dev libasound2-dev vorbis-tools
      - name: Configura
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCAMPIONE_BUILD_TOOLS=ON
      - name: Compila lo strumento di prova
        run: cmake --build build --target campione_render -j4
      - name: SoundFont di prova e controlli (intonazione, pedali e mezzo pedale, inviluppo, PANIC, SF3, SFZ, Yamaha, GM/XG)
        run: |
          python3 tools/make_test_sf2.py prova.sf2
          python3 tools/make_test_formats.py .
          python3 tools/make_test_ysfc.py .
          python3 tools/make_test_gm.py prova_gm.sf2
          ./build/campione_render_artefacts/Release/campione_render prova.sf2 accordo.wav prova.sf3 prova_sfz/prova.sfz prova_montage.X7L prova_motif.X3W prova_moxf.X6W prova_gm.sf2

  mac:
    name: macOS universale
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91Campione_VST3 MBStudio91Campione_AU MBStudio91Campione_Standalone -- -quiet
      - name: Firma ad hoc e comprimi
        run: |
          cd "build/MBStudio91Campione_artefacts/Release"
          codesign --force --deep -s - "VST3/MBStudio91 Campione.vst3"
          codesign --force --deep -s - "AU/MBStudio91 Campione.component"
          codesign --force --deep -s - "Standalone/MBStudio91 Campione.app"
          ditto -c -k --keepParent "VST3/MBStudio91 Campione.vst3"      "Campione-VST3-mac.zip"
          ditto -c -k --keepParent "AU/MBStudio91 Campione.component"   "Campione-AU-mac.zip"
          ditto -c -k --keepParent "Standalone/MBStudio91 Campione.app" "Campione-App-mac.zip"
      - name: Controllo con pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --skip-gui-tests "build/MBStudio91Campione_artefacts/Release/VST3/MBStudio91 Campione.vst3"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/MBStudio91Campione_artefacts/Release/*.zip

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -S . -B build -A x64
      - name: Compila
        run: cmake --build build --config Release --target MBStudio91Campione_VST3 MBStudio91Campione_Standalone
      - name: Comprimi
        shell: pwsh
        run: |
          $r = "build/MBStudio91Campione_artefacts/Release"
          Compress-Archive -Path "$r/VST3/MBStudio91 Campione.vst3" -DestinationPath "Campione-VST3-win.zip"
          Compress-Archive -Path "$r/Standalone/MBStudio91 Campione.exe" -DestinationPath "Campione-App-win.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  release:
    name: Pubblica in Releases
    if: github.ref == 'refs/heads/main'
    needs: [prova, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: MBStudio91 Campione 0.1.${{ github.run_number }}
          body: |
            Compilato automaticamente da GitHub dal commit ${{ github.sha }}.

            **Mac** (Apple Silicon e Intel, macOS 11 o successivo)
            - Campione-VST3-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/VST3/
            - Campione-AU-mac.zip: estrai e copia in ~/Library/Audio/Plug-Ins/Components/
            - Campione-App-mac.zip: versione autonoma, va in Applicazioni
            Il plugin non è firmato da Apple: dopo averlo copiato, nel Terminale
            `xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/VST3/"MBStudio91 Campione.vst3" ~/Library/Audio/Plug-Ins/Components/"MBStudio91 Campione.component" /Applications/"MBStudio91 Campione.app"`

            **Windows** (64 bit)
            - Campione-VST3-win.zip: estrai e copia la cartella "MBStudio91 Campione.vst3" in C:\Program Files\Common Files\VST3\
            - Campione-App-win.zip: versione autonoma (MBStudio91 Campione.exe)
          files: dist/*.zip
